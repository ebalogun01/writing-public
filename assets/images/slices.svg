<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-labelledby="sl-title">
  <title id="sl-title">Speed against time as a straight line; the triangle beneath it is exactly half the rectangle of the final speed held for the whole trip</title>
  <style>
    .axis  { stroke: #27262b; stroke-width: 2; fill: none; stroke-linecap: round; }
    .line  { stroke: #7253ed; stroke-width: 2.5; fill: none; }
    .rect  { fill: none; stroke: #b8b6ba; stroke-width: 1.6; stroke-dasharray: 7 5; }
    .strip { fill: #ede7fd; stroke: #b9a6f5; stroke-width: 0.7; }
    .guide { stroke: #cfcdd2; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
    .lbl-i { font: italic 500 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #27262b; }
    .lbl   { font: 500 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #27262b; }
    .lbl-a { font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #7253ed; }
    .lbl-m { font: 500 14px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6e6b71; }
  </style>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27262b" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7253ed" />
    </marker>
  </defs>

  <!-- origin (80,258); final time at x=380; final speed at y=78 -->

  <!-- the rectangle we did NOT travel: final speed held the whole way -->
  <rect class="rect" x="80" y="78" width="300" height="180" />

  <!-- strips filling the triangle under the line (10 strips of width 30) -->
  <g>
    <rect class="strip" x="80"  y="240" width="30" height="18" />
    <rect class="strip" x="110" y="222" width="30" height="36" />
    <rect class="strip" x="140" y="204" width="30" height="54" />
    <rect class="strip" x="170" y="186" width="30" height="72" />
    <rect class="strip" x="200" y="168" width="30" height="90" />
    <rect class="strip" x="230" y="150" width="30" height="108" />
    <rect class="strip" x="260" y="132" width="30" height="126" />
    <rect class="strip" x="290" y="114" width="30" height="144" />
    <rect class="strip" x="320" y="96"  width="30" height="162" />
    <rect class="strip" x="350" y="78"  width="30" height="180" />
  </g>

  <!-- the line v = a t -->
  <line class="line" x1="80" y1="258" x2="392" y2="71" marker-end="url(#tip)" />
  <text class="lbl-a" x="396" y="66">v = a&#183;t</text>

  <!-- axes -->
  <line class="axis" x1="80" y1="258" x2="500" y2="258" marker-end="url(#ax)" />
  <line class="axis" x1="80" y1="258" x2="80"  y2="40"  marker-end="url(#ax)" />
  <text class="lbl-i" x="506" y="264">t</text>
  <text class="lbl-i" x="62"  y="38">v</text>
  <text class="lbl"   x="64"  y="278">0</text>

  <!-- final speed marker on v axis -->
  <line class="guide" x1="80" y1="78" x2="380" y2="78" />
  <text class="lbl-a" x="24" y="74">a&#183;t</text>

  <!-- final time marker on t axis -->
  <line class="guide" x1="380" y1="78" x2="380" y2="258" />
  <text class="lbl-a" x="374" y="278">t</text>

  <!-- label for the rectangle -->
  <text class="lbl-m" x="150" y="60">the trip we did not take: (a&#183;t) &#215; t = a t&#178;</text>

  <!-- label inside the triangle -->
  <text class="lbl-a" x="250" y="232" font-size="17">&#189; a t&#178;</text>
  <text class="lbl-m" x="196" y="250" font-size="13">what we actually cover</text>

  <text class="lbl-m" x="80" y="316">The line is straight, so the triangle is exactly half the rectangle.</text>
</svg>
