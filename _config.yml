title: Emmanuel Balogun — Writing
description: Essays on math, engineering, and the ideas underneath them.
theme: just-the-docs

url: https://ebalogun01.github.io
baseurl: /writing-public

author: Emmanuel Balogun

# Default kramdown math_engine is "mathjax", which emits \( \) and \[ \]
# delimiters. MathJax v3 is loaded in _includes/head_custom.html and
# configured to match.

search_enabled: true
search:
  heading_level: 2
  previews: 3

heading_anchors: true
color_scheme: light

aux_links:
  GitHub:
    - "https://github.com/ebalogun01"
aux_links_new_tab: true

# Add your Medium / Substack URLs here and they'll show in the sidebar.
# nav_external_links:
#   - title: Medium
#     url: https://medium.com/@YOUR-HANDLE
#   - title: Substack
#     url: https://YOUR-NAME.substack.com

footer_content: "&copy; 2026 Emmanuel Balogun."

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/ebalogun01/writing-public"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

callouts:
  note:
    title: Note
    color: blue
  aside:
    title: Aside
    color: grey-dk

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
